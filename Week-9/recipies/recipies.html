<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book</title>
    <link rel="stylesheet" href="./recipies.css">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipe Book">
    <meta property="og:description" content="A book of recipes">
    <meta property="og:url" content="https://rayce303.github.io/wdd130/">
    <meta property="og:image" content="social-preview-image.png">
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Recipe Book">
    <meta name="twitter:description" content="A book of recipes">
    <meta name="twitter:image" content="social-preview-image.png">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <script src="./recipes.js" defer></script>
</head>
<body>
    <header>
        <img src="./images and icons/recipe-book.png" alt="RecipeBook Logo">
        <h1>RecipeBook</h1>
    </header>

    <main>
        <div class="searchbar">
            <input placeholder="Find a recipe">
            <button id="searchbutton">
                <img src="./images and icons/search.svg" alt="Search Icon">
            </button>
        </div>
        <hr>
        <div class="contentGoesHere">

        </div>
    </main>

    <footer>
        <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
            <a href="#"><img src="./images and icons/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="./images and icons/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="./images and icons/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
    </footer>

</html>
